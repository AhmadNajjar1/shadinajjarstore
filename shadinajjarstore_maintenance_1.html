<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadi Najjar Store — Receipts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; color: #111; padding: 20px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 17px; color: #666; margin-bottom: 20px; }
  .counter-bar { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .counter-bar span { font-size: 17px; color: #555; }
  .counter-bar strong { font-size: 22px; color: #111; }
  .counter-right { display: flex; align-items: center; gap: 10px; }
  .history-btn { font-size: 16px; color: #333; background: none; border: 1px solid #ddd; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .history-btn:hover { color: #111; border-color: #999; }
  .sync-status { font-size: 15px; padding: 3px 8px; border-radius: 5px; }
  .sync-ok { background: #e6f4ea; color: #2d7a3a; }
  .sync-err { background: #fce8e6; color: #c5221f; }
  .sync-loading { background: #fff3e0; color: #b45309; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 16px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .row.full { grid-template-columns: 1fr; }
  .field label { display: block; font-size: 16px; color: #666; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 8px 10px; font-size: 17px;
    border: 1px solid #ccc; border-radius: 7px;
    background: #fafafa; color: #111; font-family: Arial, sans-serif;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: #555; background: #fff; }
  .field textarea { resize: vertical; min-height: 65px; }

  .btn-row { margin-bottom: 12px; }
  .print-btn {
    width: 100%; padding: 13px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 10px;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .print-btn:disabled { background: #999 !important; color: #fff !important; cursor: not-allowed; }
  .btn-receipt { background: #111; color: #fff; }
  .btn-receipt:hover:not(:disabled) { background: #333; }

  .note { font-size: 16px; color: #888; text-align: center; margin-bottom: 16px; }

  @media print {
    body > * { display: none !important; }
    #print-area { display: block !important; }
    
  }

  #print-area { display: none; }

  .receipt {
    width: 52mm; margin: 0 auto;
    font-family: 'Courier New', Courier, monospace;
    font-size: 8.5pt; line-height: 1.45;
    color: #000; background: #fff; padding: 4mm 3mm;
  }
  .r-name { font-size: 11pt; font-weight: bold; text-align: center; letter-spacing: 1px; }
  .r-address { font-size: 7.5pt; text-align: center; color: #333; }
  .r-dash { border: none; border-top: 1px dashed #000; margin: 2.5mm 0; }
  .r-num-box { border: 1.5px solid #000; text-align: center; font-size: 14pt; font-weight: bold; letter-spacing: 4px; padding: 2mm 0; margin: 1mm 0; }
  .r-date { font-size: 7.5pt; text-align: center; color: #444; }
  .r-lbl { font-size: 7pt; color: #555; margin-top: 1.5mm; }
  .r-val { font-size: 8.5pt; font-weight: bold; }
  .r-val-sm { font-size: 8pt; }
  .r-arabic { direction: rtl; text-align: right; font-family: Arial, sans-serif; font-size: 7.5pt; line-height: 1.7; color: #111; }
  .r-copy-label { text-align: center; font-size: 7pt; color: #666; margin-top: 1mm; font-family: Arial, sans-serif; }

  .history-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 1000;
  }
  .history-overlay.open { display: flex; }
  .history-panel {
    background: #fff; border-radius: 12px; max-width: 640px; width: 100%;
    max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .history-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .history-head strong { font-size: 18px; }
  .history-close { background: none; border: none; font-size: 24px; line-height: 1; color: #888; cursor: pointer; }
  .history-close:hover { color: #111; }
  .history-search { padding: 12px 16px; border-bottom: 1px solid #eee; }
  .history-search input {
    width: 100%; padding: 8px 10px; font-size: 17px;
    border: 1px solid #ccc; border-radius: 7px; background: #fafafa; color: #111;
  }
  .history-list { overflow-y: auto; padding: 6px 16px 16px; }
  .history-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .history-row:last-child { border-bottom: none; }
  .history-row .h-top { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; }
  .history-row .h-meta { font-size: 14px; color: #666; margin-top: 2px; }
  .history-row .h-problem { font-size: 14px; color: #444; margin-top: 2px; }
  .history-empty { text-align: center; color: #888; padding: 30px 0; font-size: 16px; }
</style>
<style id="print-style"></style>
</head>
<body>

<h1>Shadi Najjar Store</h1>
<p class="subtitle">Receipt Generator — Thermal 72mm</p>

<div class="counter-bar">
  <div>
    <span>Next receipt number: </span>
    <strong id="display-num">...</strong>
  </div>
  <div class="counter-right">
    <span class="sync-status sync-loading" id="sync-status">Connecting...</span>
    <button class="history-btn" onclick="openHistory()">🕘 History</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Customer info</div>
  <div class="row">
    <div class="field"><label>Customer name</label><input id="f-name" type="text" placeholder="e.g. Ahmad Khalil"></div>
    <div class="field"><label>Phone number</label><input id="f-phone" type="text" placeholder="e.g. 03-123456"></div>
  </div>
</div>

<div class="card">
  <div class="card-title">Device details</div>
  <div class="row">
    <div class="field"><label>Brand</label><input id="f-brand" type="text" placeholder="e.g. Samsung"></div>
    <div class="field"><label>Model</label><input id="f-model" type="text" placeholder="e.g. Galaxy S22"></div>
  </div>
  <div class="row">
    <div class="field"><label>Color / condition</label><input id="f-color" type="text" placeholder="e.g. Black, cracked screen"></div>
    <div class="field"><label>IMEI / Serial (optional)</label><input id="f-imei" type="text" placeholder=""></div>
  </div>
</div>

<div class="card">
  <div class="card-title">Repair details</div>
  <div class="row full">
    <div class="field"><label>Problem description</label><textarea id="f-problem" placeholder="e.g. Screen not working, battery drains fast..."></textarea></div>
  </div>
  <div class="row full">
    <div class="field"><label>Added items / accessories received</label><input id="f-items" type="text" placeholder="e.g. Charger, case — or leave blank"></div>
  </div>
</div>

<div class="btn-row">
  <button class="print-btn btn-receipt" id="btn-receipt" onclick="printBoth()" disabled>🧾 Print receipts (customer + employee)</button>
</div>
<p class="note">Prints the customer copy first — once it's done, tear it off and the employee copy prints automatically. Tear that off too.</p>

<div id="print-area"></div>

<div class="history-overlay" id="history-overlay">
  <div class="history-panel">
    <div class="history-head">
      <strong>Past receipts</strong>
      <button class="history-close" onclick="closeHistory()">&times;</button>
    </div>
    <div class="history-search">
      <input id="history-search-input" type="text" placeholder="Search by name, phone, or receipt #" oninput="filterHistory()">
    </div>
    <div class="history-list" id="history-list">
      <div class="history-empty">Loading...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, runTransaction,
    collection, query, orderBy, limit, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA9stOV8fyLiJwECjVfF5SqDdg_ppeu1Gw",
    authDomain: "shadi-receipts.firebaseapp.com",
    projectId: "shadi-receipts",
    storageBucket: "shadi-receipts.firebasestorage.app",
    messagingSenderId: "180848858539",
    appId: "1:180848858539:web:a6e277baf34f09c263aeee"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const counterRef = doc(db, "store", "counter");
  const receiptsCol = collection(db, "receipts");

  let currentNum = null;
  let historyCache = [];

  async function loadCounter() {
    try {
      const snap = await getDoc(counterRef);
      const val = snap.exists() ? snap.data().value : 0;
      updateDisplay(val + 1);
      document.getElementById('sync-status').textContent = '✓ Connected';
      document.getElementById('sync-status').className = 'sync-status sync-ok';
      document.getElementById('btn-receipt').disabled = false;
    } catch(e) {
      document.getElementById('sync-status').textContent = '✗ Offline';
      document.getElementById('sync-status').className = 'sync-status sync-err';
      document.getElementById('display-num').textContent = 'ERR';
    }
  }

  function updateDisplay(n) {
    document.getElementById('display-num').textContent = String(n).padStart(6, '0');
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function getDateTime() {
    const now = new Date();
    const h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    return pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear()
      +' — '+pad(h12)+':'+pad(now.getMinutes())+' '+ampm;
  }

  function getFormValues() {
    return {
      name:    document.getElementById('f-name').value.trim() || '—',
      phone:   document.getElementById('f-phone').value.trim() || '—',
      brand:   document.getElementById('f-brand').value.trim() || '—',
      model:   document.getElementById('f-model').value.trim() || '—',
      color:   document.getElementById('f-color').value.trim() || '—',
      imei:    document.getElementById('f-imei').value.trim(),
      problem: document.getElementById('f-problem').value.trim() || '—',
      items:   document.getElementById('f-items').value.trim() || '—'
    };
  }

  function buildReceipt(num, v, dt, copyLabelAr, copyLabelEn) {
    return `
      <div class="receipt">
        <div class="r-name">Shadi Najjar Store</div>
        <div class="r-address">Barbir — Behind Blom Bank</div>
        <div class="r-address">WhatsApp: 76-630620</div>
        <hr class="r-dash">
        <div class="r-num-box">${num}</div>
        <div class="r-date">${dt}</div>
        <hr class="r-dash">
        <div class="r-lbl">Customer</div>
        <div class="r-val">${v.name}</div>
        <div class="r-val-sm">${v.phone}</div>
        <hr class="r-dash">
        <div class="r-lbl">Device</div>
        <div class="r-val">${v.brand} ${v.model}</div>
        <div class="r-val-sm">${v.color}</div>
        ${v.imei ? `<div class="r-val-sm" style="font-size:7.5pt;">IMEI/S/N: ${v.imei}</div>` : ''}
        <hr class="r-dash">
        <div class="r-lbl">Problem</div>
        <div class="r-val-sm">${v.problem}</div>
        <div class="r-lbl" style="margin-top:2mm;">Items received</div>
        <div class="r-val-sm">${v.items}</div>
        <hr class="r-dash">
        <div class="r-arabic">
          ⚠ القطعة تتلف بعد شهر من تاريخ إخباركم.<br>
          للاستلام يجب إحضار الوصل الأصلي،<br>
          ولا نقبل صورة الوصل.
        </div>
        <hr class="r-dash">
        <div class="r-copy-label">${copyLabelAr} — ${copyLabelEn}</div>
      </div>
    `;
  }

  // Prints the customer copy, then automatically prints the employee copy
  // right after — same 72mm paper, same printer. Tear off between each.
  // Also saves the receipt to Firestore so it shows up in History.
  window.printBoth = async function() {
    const btn = document.getElementById('btn-receipt');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const v  = getFormValues();
    const dt = getDateTime();

    let newCounter;
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(counterRef);
        newCounter = (snap.exists() ? snap.data().value : 0) + 1;
        const numStr = String(newCounter).padStart(6, '0');
        transaction.set(counterRef, { value: newCounter });
        transaction.set(doc(receiptsCol, numStr), {
          number: numStr,
          ...v,
          date: dt,
          createdAt: serverTimestamp()
        });
      });
    } catch(e) {
      alert('Could not save — check your internet connection.');
      btn.disabled = false;
      btn.textContent = '🧾 Print receipts (customer + employee)';
      return;
    }

    currentNum = String(newCounter).padStart(6, '0');
    updateDisplay(newCounter + 1);
    document.getElementById('print-style').textContent = '@page{size:72mm auto;margin:0}';

    btn.textContent = 'Printing customer copy...';

    const printEmployeeCopy = function() {
      btn.textContent = 'Printing employee copy...';
      document.getElementById('print-area').innerHTML = buildReceipt(currentNum, v, dt, 'نسخة الموظف', 'Employee copy');
      setTimeout(() => window.print(), 300);
      window.addEventListener('afterprint', finish, { once: true });
    };

    const finish = function() {
      btn.disabled = false;
      btn.textContent = '🧾 Print receipts (customer + employee)';
    };

    window.addEventListener('afterprint', printEmployeeCopy, { once: true });
    document.getElementById('print-area').innerHTML = buildReceipt(currentNum, v, dt, 'نسخة الزبون', 'Customer copy');
    setTimeout(() => window.print(), 300);
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderHistory(list) {
    const container = document.getElementById('history-list');
    if (!list.length) {
      container.innerHTML = '<div class="history-empty">No receipts yet.</div>';
      return;
    }
    container.innerHTML = list.map(r => `
      <div class="history-row">
        <div class="h-top"><span>#${escapeHtml(r.number || '')}</span><span>${escapeHtml(r.date || '')}</span></div>
        <div class="h-meta">${escapeHtml(r.name || '—')} · ${escapeHtml(r.phone || '—')} · ${escapeHtml(r.brand || '')} ${escapeHtml(r.model || '')}</div>
        <div class="h-problem">${escapeHtml(r.problem || '')}</div>
      </div>
    `).join('');
  }

  window.filterHistory = function() {
    const q = document.getElementById('history-search-input').value.trim().toLowerCase();
    if (!q) { renderHistory(historyCache); return; }
    renderHistory(historyCache.filter(r =>
      (r.number || '').toLowerCase().includes(q) ||
      (r.name || '').toLowerCase().includes(q) ||
      (r.phone || '').toLowerCase().includes(q)
    ));
  };

  async function loadHistory() {
    const container = document.getElementById('history-list');
    container.innerHTML = '<div class="history-empty">Loading...</div>';
    try {
      const q = query(receiptsCol, orderBy('number', 'desc'), limit(200));
      const snap = await getDocs(q);
      historyCache = snap.docs.map(d => d.data());
      renderHistory(historyCache);
    } catch(e) {
      container.innerHTML = '<div class="history-empty">Could not load history — check your internet connection.</div>';
    }
  }

  window.openHistory = function() {
    document.getElementById('history-overlay').classList.add('open');
    document.getElementById('history-search-input').value = '';
    loadHistory();
  };

  window.closeHistory = function() {
    document.getElementById('history-overlay').classList.remove('open');
  };

  loadCounter();
</script>
</body>
</html>
